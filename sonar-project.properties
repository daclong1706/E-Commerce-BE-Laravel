# SonarQube Project Configuration
sonar.projectKey=ecommerce-laravel
sonar.projectName=E-Commerce Laravel Backend
sonar.projectVersion=1.0

# Source and test directories
sonar.sources=app,routes,config,database/migrations,database/seeders
sonar.tests=tests

# Language
sonar.language=php

# Coverage and test reports
sonar.php.coverage.reportPaths=coverage.xml
sonar.php.tests.reportPath=junit.xml

# Exclusions
sonar.exclusions=vendor/**,bootstrap/cache/**,storage/**,public/**,node_modules/**,database/factories/**,*.blade.php

# Test exclusions
sonar.test.exclusions=tests/**

# Encoding
sonar.sourceEncoding=UTF-8

# PHP specific settings
sonar.php.file.suffixes=php
sonar.php.coverage.itReportPaths=coverage.xml
